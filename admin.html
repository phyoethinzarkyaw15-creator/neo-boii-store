<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo Empire — Admin Panel</title>
    <meta name="description" content="Neo Empire administration panel for managing products, Myanmar Kyat (MMK) pricing, availability status, and account images." />
    <meta property="og:title" content="Neo Empire — Admin Panel" />
    <meta property="og:description" content="Neo Empire administration panel for managing products, Myanmar Kyat (MMK) pricing, availability status, and account images." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/jpeg" href="/assets/neo-empire-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #08080A;
        color: #F4F2ED;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      #admin-root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #08080A;
        color: #F4F2ED;
      }
      .neo-fallback-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #08080A;
        color: #F4F2ED;
      }
      .neo-fallback-header {
        width: 100%;
        background-color: rgba(8, 8, 10, 0.95);
        border-bottom: 1px solid rgba(197, 160, 89, 0.25);
      }
      .neo-fallback-header-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .neo-fallback-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .neo-fallback-logo {
        width: 36px;
        height: 36px;
        min-width: 36px;
        max-width: 36px;
        max-height: 36px;
        object-fit: contain;
        border-radius: 8px;
        border: 1px solid rgba(197, 160, 89, 0.45);
      }
      .neo-fallback-title {
        font-family: 'Outfit', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #E5C878;
      }
      .neo-fallback-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: #34D399;
      }
      .neo-fallback-store-link {
        min-height: 40px;
        padding: 8px 12px;
        border-radius: 8px;
        background-color: #14161D;
        color: #E5C878;
        border: 1px solid rgba(197, 160, 89, 0.35);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      .neo-fallback-main {
        flex: 1;
        max-width: 1240px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 16px;
      }
      .neo-fallback-kicker {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: #C5A059;
        margin-bottom: 4px;
      }
      .neo-fallback-heading {
        font-family: 'Outfit', system-ui, sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #F4F2ED;
        margin: 0;
      }
    </style>
  </head>
  <body class="bg-[#08080A] text-[#F4F2ED] antialiased selection:bg-[#C5A059]/30 selection:text-[#F3E3B2]">
    <div id="admin-root">
      <div class="neo-fallback-shell">
        <header class="neo-fallback-header">
          <div class="neo-fallback-header-inner">
            <div class="neo-fallback-brand">
              <img src="/assets/neo-empire-logo.jpg" alt="Neo Empire Logo" width="36" height="36" class="neo-fallback-logo" />
              <div>
                <div class="neo-fallback-title">NEO EMPIRE</div>
                <div class="neo-fallback-subtitle">Admin Panel</div>
              </div>
            </div>
            <a href="/index.html" class="neo-fallback-store-link">Public Store</a>
          </div>
        </header>
        <main class="neo-fallback-main">
          <section id="admin-dashboard">
            <div class="neo-fallback-kicker">NEO EMPIRE · PRODUCT MANAGEMENT</div>
            <h1 class="neo-fallback-heading">Admin Dashboard</h1>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
